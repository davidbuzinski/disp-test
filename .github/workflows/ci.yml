name: MATLAB Test
on: [push]

jobs:
  hello:
    runs-on: [windows-latest]
    steps:
      - name: Install MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: r2023a
          cache: true
          
      - name: disp hello
        uses: matlab-actions/run-command@v3.2
        with:
          command: |
            disp('Hello world');
            disp('こんにちは');

      - name: other test
        run: |
          curl -L -o run-matlab-command.exe https://ssd.mathworks.com/supportfiles/ci/run-matlab-command/v2/win64/run-matlab-command.exe
          run-matlab-command "disp("hello"); disp('こんにちは')" > out.txt

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: output
          path: ./out.txt
